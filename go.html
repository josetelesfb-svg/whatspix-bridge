<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Receitas Sem Culpa</title>
<style>
  :root {
    --bg: #fffaf3;
    --text: #2b2118;
    --muted: #6b5d50;
    --accent: #25d366;       /* cor do botão (verde WhatsApp) */
    --accent-dark: #1da851;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px calc(32px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 { font-size: 1.9rem; line-height: 1.15; font-weight: 800; }
  .sub { font-size: 1.05rem; color: var(--muted); }

  /* ===== ESPAÇO RESERVADO PARA A IMAGEM DO PRODUTO =====
     Troque o <div class="img-slot"> no HTML por:
     <img class="img-produto" src="produto.webp" width="440" height="440" alt="...">
     (use .webp leve, idealmente < 80 KB) */
  .img-slot {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: #f0e6d8;
    border: 2px dashed #d9c7b0;
    display: flex; align-items: center; justify-content: center;
    color: #a8927a; font-size: .9rem;
  }
  .img-produto { width: 100%; height: auto; border-radius: 14px; display: block; }

  ul.beneficios { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  ul.beneficios li {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px 12px 42px;
    position: relative;
    font-size: 1rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  ul.beneficios li::before {
    content: "✓";
    position: absolute; left: 14px; top: 11px;
    font-weight: 800; color: var(--accent-dark);
  }

  .cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    min-height: 60px;
    padding: 16px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 1.15rem; font-weight: 800;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(37, 211, 102, .35);
    -webkit-tap-highlight-color: transparent;
  }
  .cta:active { background: var(--accent-dark); transform: scale(.98); }
  .cta svg { width: 24px; height: 24px; flex: none; fill: currentColor; }
  .nota { text-align: center; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Receitas Sem Culpa</h1>
  <p class="sub">Descubra como comer bem sem abrir mão do sabor</p>

  <!-- IMAGEM DO PRODUTO: substituir este bloco pela <img> (ver comentário no CSS) -->
  <div class="img-slot">Imagem do produto aqui</div>

  <ul class="beneficios">
    <li>Benefício 1 (placeholder)</li>
    <li>Benefício 2 (placeholder)</li>
    <li>Benefício 3 (placeholder)</li>
  </ul>

  <!-- O href é preenchido pelo script no carregamento. O "#" é só fallback. -->
  <a id="cta" class="cta" href="#" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.03c-.24.68-1.42 1.31-1.96 1.36-.5.05-.97.23-3.27-.68-2.76-1.09-4.5-3.92-4.64-4.1-.13-.18-1.1-1.47-1.1-2.8 0-1.33.7-1.99.95-2.26.24-.27.53-.34.71-.34h.51c.16 0 .38-.06.6.46.23.54.77 1.87.84 2.01.07.13.11.29.02.47-.09.18-.13.29-.27.45-.13.16-.28.35-.4.47-.13.13-.27.28-.12.55.16.27.7 1.15 1.49 1.86 1.03.92 1.9 1.2 2.17 1.34.27.13.43.11.58-.07.16-.18.67-.78.85-1.05.18-.27.36-.22.6-.13.25.09 1.57.74 1.84.88.27.13.45.2.51.31.07.11.07.65-.17 1.32z"/></svg>
    Falar no WhatsApp
  </a>
  <p class="nota">Atendimento rápido pelo WhatsApp</p>
</main>

<script>
  /* ================== CONFIGURAÇÃO (EDITAR AQUI) ================== */
  const WEBHOOK_URL = "COLOCAR_URL_DO_WEBHOOK_N8N_AQUI";
  const WHATSAPP_NUMERO = "COLOCAR_NUMERO_AQUI"; // formato: código do país + DDD + número, só dígitos, sem + nem espaços (ex: 5579991066805)
  const MENSAGEM_BASE = "Olá! Vim pelo anúncio e quero saber mais.";
  /* ================================================================ */

  (function () {
    // 1) Parâmetros da URL (todos opcionais -> string vazia se ausentes)
    var params = new URLSearchParams(window.location.search);
    var ttclid  = params.get("ttclid")  || "";
    var ad      = params.get("ad")      || "";
    var produto = params.get("produto") || "";

    // 2) ID curto: timestamp em base36 (8 chars) + 2 chars aleatórios = 10 chars [a-z0-9]
    var id_curto = Date.now().toString(36) +
                   Math.random().toString(36).slice(2, 4).padEnd(2, "0");

    // 4) Link do WhatsApp -> href real do botão (sem redirect por JS)
    var mensagem = MENSAGEM_BASE + " [ID:" + id_curto + "]";
    document.getElementById("cta").href =
      "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(mensagem);

    // 3) Envio ao webhook: fire-and-forget, não bloqueia nada, falha em silêncio
    if (WEBHOOK_URL.indexOf("http") !== 0) return; // placeholder ainda não trocado
    var payload = JSON.stringify({
      id_curto: id_curto,
      ttclid: ttclid,
      ad: ad,
      produto: produto,
      timestamp: new Date().toISOString()
    });
    try {
      // text/plain + no-cors = "simple request": sem preflight CORS, então o
      // keepalive funciona em todos os navegadores (inclusive in-app do TikTok).
      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: payload
      }).catch(function () {});
    } catch (e) { /* silencioso */ }
  })();
</script>
</body>
</html>
