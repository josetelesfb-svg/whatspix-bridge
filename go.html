    background-size: 100% 100%, 100% 100%, 200px 200px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;

  main {
    max-width: 480px;
    margin: 0 auto;

  /* ===== ESPAÇO RESERVADO PARA A IMAGEM DO PRODUTO =====
     Troque o <div class="img-slot"> no HTML por:
     <img class="img-produto" src="produto.webp" width="440" height="440" alt="...">
     (use .webp leve, idealmente < 80 KB) */
  .img-slot {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: #f0e6d8;
    border: 2px dashed #d9c7b0;
    display: flex; align-items: center; justify-content: center;
    color: #a8927a; font-size: .9rem;
  }
  .img-produto {
    width: 60%; max-width: 230px; height: auto; margin: 0 auto;
    border-radius: 10px; display: block;
    box-shadow: 0 10px 28px rgba(47, 42, 34, .25);
  }

  ul.beneficios { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  ul.beneficios li {
    background: rgba(255, 255, 255, .85);
    border: 1px solid #eadcc4;
    border-radius: 12px;
    padding: 10px 14px 10px 42px;
    position: relative;
    font-size: 1rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  ul.beneficios li::before {
    content: "✓";
    position: absolute; left: 14px; top: 9px;
    font-weight: 800; color: var(--brand);
  }

  .cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;

  .cta:active { background: var(--accent-dark); transform: scale(.98); }
  .cta svg { width: 24px; height: 24px; flex: none; fill: currentColor; }
  .nota { text-align: center; font-size: .85rem; color: var(--muted); }

<body>
<main>
  <p class="selo">Receitas Sem Culpa</p>
  <h1>50 Receitas de Pães Saudáveis</h1>
  <p class="sub">Sem glúten, sem açúcar refinado e sem lactose</p>

  <!-- IMAGEM DO PRODUTO (capa do ebook, 560px, ~115 KB) -->
  <img class="img-produto" src="capa.jpg" width="560" height="792" alt="Capa do ebook 50 Receitas de Pães Saudáveis" fetchpriority="high">

    <li>Sem glúten e sem lactose</li>
    <li>Opções doces e salgadas</li>
    <li>Receitas equilibradas pro dia a dia</li>
  </ul>

  <!-- O href é preenchido pelo script no carregamento. O "#" é só fallback. -->

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.03c-.24.68-1.42 1.31-1.96 1.36-.5.05-.97.23-3.27-.68-2.76-1.09-4.5-3.92-4.64-4.1-.13-.18-1.1-1.47-1.1-2.8 0-1.33.7-1.99.95-2.26.24-.27.53-.34.71-.34h.51c.16 0 .38-.06.6.46.23.54.77 1.87.84 2.01.07.13.11.29.02.47-.09.18-.13.29-.27.45-.13.16-.28.35-.4.47-.13.13-.27.28-.12.55.16.27.7 1.15 1.49 1.86 1.03.92 1.9 1.2 2.17 1.34.27.13.43.11.58-.07.16-.18.67-.78.85-1.05.18-.27.36-.22.6-.13.25.09 1.57.74 1.84.88.27.13.45.2.51.31.07.11.07.65-.17 1.32z"/></svg>
    Falar no WhatsApp
  </a>
  <p class="nota">Atendimento rápido pelo WhatsApp</p>
</main>

<script>
  /* ================== CONFIGURAÇÃO (EDITAR AQUI) ================== */
  const WEBHOOK_URL = "https://n8n.srv1661587.hstgr.cloud/webhook/ouro-bridge-clique";
  const WHATSAPP_NUMERO = "5579991068519"; // formato: código do país + DDD + número, só dígitos, sem + nem espaços (ex: 5579991066805)
  const MENSAGEM_BASE = "Olá! Vim pelo anúncio e quero saber mais.";
  /* ================================================================ */

  (function () {
    // 1) Parâmetros da URL (todos opcionais -> string vazia se ausentes)
    var params = new URLSearchParams(window.location.search);
    var ttclid  = params.get("ttclid")  || "";
    var ad      = params.get("ad")      || "";
    var produto = params.get("produto") || "";

    // 2) ID curto: timestamp em base36 (8 chars) + 2 chars aleatórios = 10 chars [a-z0-9]
    var id_curto = Date.now().toString(36) +
                   Math.random().toString(36).slice(2, 4).padEnd(2, "0");

    // 4) Link do WhatsApp -> href real do botão (sem redirect por JS)
    var mensagem = MENSAGEM_BASE + " Meu código de atendimento: " + id_curto;
    document.getElementById("cta").href =
      "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(mensagem);

    // 3) Envio ao webhook: fire-and-forget, não bloqueia nada, falha em silêncio
    if (WEBHOOK_URL.indexOf("http") !== 0) return; // placeholder ainda não trocado
    var payload = new URLSearchParams({
      id_curto: id_curto,
      ttclid: ttclid,
      ad: ad,
      produto: produto,
      timestamp: new Date().toISOString()
    });
    try {
      // Formato formulário (application/x-www-form-urlencoded) = "simple request":
      // sem preflight CORS, então o keepalive funciona em todos os navegadores
      // (inclusive in-app do TikTok), e o n8n já entrega os campos prontos em $json.body.
      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        body: payload
      }).catch(function () {});
    } catch (e) { /* silencioso */ }
  })();
</script>
